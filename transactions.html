<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Finora — Transactions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app-shell">

  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="sidebar-brand-icon">F</div>
      <div class="sidebar-brand-name">Finora</div>
    </div>

    <nav class="sidebar-nav" aria-label="Primary">
      <a href="index.html" class="nav-link">
        <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M3 10.5L12 3l9 7.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 9.5V20a1 1 0 001 1h4v-6h4v6h4a1 1 0 001-1V9.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Dashboard
      </a>
      <a href="transactions.html" class="nav-link active">
        <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M8 6h13M8 12h13M8 18h13" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M3 6h.01M3 12h.01M3 18h.01" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
        Transactions
      </a>
      <a href="#" class="nav-link">
        <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="8" height="8" rx="2" stroke="currentColor" stroke-width="2"/><rect x="13" y="3" width="8" height="5" rx="2" stroke="currentColor" stroke-width="2"/><rect x="13" y="12" width="8" height="9" rx="2" stroke="currentColor" stroke-width="2"/><rect x="3" y="15" width="8" height="6" rx="2" stroke="currentColor" stroke-width="2"/></svg>
        Budgets
      </a>
      <a href="#" class="nav-link">
        <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 19V5a1 1 0 011-1h10.5L20 8.5V19a1 1 0 01-1 1H5a1 1 0 01-1-1z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M8 13h8M8 17h5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        Reports
      </a>
      <a href="#" class="nav-link">
        <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09a1.65 1.65 0 00-1-1.51 1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09a1.65 1.65 0 001.51-1 1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z" stroke="currentColor" stroke-width="2"/></svg>
        Settings
      </a>
    </nav>

    <div class="sidebar-profile">
      <div class="profile-avatar">AK</div>
      <div class="profile-info">
        <div class="profile-name">Alex Kim</div>
        <div class="profile-email">alex@finora.app</div>
      </div>
      <svg class="profile-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M8 4l8 8-8 8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
  </aside>

  <main class="main-content">

    <header class="page-header">
      <div>
        <h1>Transactions</h1>
        <p>Track and manage all your income and expenses.</p>
      </div>
      <button type="button" class="btn-primary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="#fff" stroke-width="2.3" stroke-linecap="round"/></svg>
        Add Transaction
      </button>
    </header>

    <div class="toolbar">
      <div class="search-box">
        <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="#A8A8B3" stroke-width="2"/><path d="M21 21l-4.35-4.35" stroke="#A8A8B3" stroke-width="2" stroke-linecap="round"/></svg>
        <input id="searchInput" type="search" class="search-input" placeholder="Search transactions...">
      </div>

      <div class="toolbar-divider"></div>

      <div class="tabs" role="tablist" aria-label="Filter by type">
        <button type="button" class="tab-btn active" data-filter="all">All</button>
        <button type="button" class="tab-btn" data-filter="income">Income</button>
        <button type="button" class="tab-btn" data-filter="expense">Expenses</button>
      </div>

      <div class="filter-group">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" style="flex-shrink:0;"><rect x="3" y="4" width="7" height="7" rx="1.5" stroke="#8A8A96" stroke-width="2"/><rect x="14" y="4" width="7" height="4" rx="1.5" stroke="#8A8A96" stroke-width="2"/><rect x="14" y="12" width="7" height="8" rx="1.5" stroke="#8A8A96" stroke-width="2"/><rect x="3" y="15" width="7" height="5" rx="1.5" stroke="#8A8A96" stroke-width="2"/></svg>
        <select id="categoryFilter" class="filter-select" aria-label="Filter by category">
          <option value="All">All Categories</option>
          <option value="Food & Drink">Food & Drink</option>
          <option value="Subscription">Subscription</option>
          <option value="Income">Income</option>
          <option value="Transport">Transport</option>
          <option value="Groceries">Groceries</option>
          <option value="Utilities">Utilities</option>
          <option value="Housing">Housing</option>
          <option value="Health">Health</option>
          <option value="Shopping">Shopping</option>
        </select>
      </div>

      <div class="filter-group">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" style="flex-shrink:0;"><rect x="3" y="5" width="18" height="16" rx="2" stroke="#8A8A96" stroke-width="2"/><path d="M3 10h18M8 3v4M16 3v4" stroke="#8A8A96" stroke-width="2" stroke-linecap="round"/></svg>
        <select id="dateFilter" class="filter-select" aria-label="Filter by date">
          <option value="all">All Time</option>
          <option value="7">Last 7 days</option>
          <option value="30">Last 30 days</option>
          <option value="90">Last 3 months</option>
        </select>
      </div>

      <button type="button" id="clearFiltersBtn" class="clear-filters-btn" hidden>Clear filters</button>
    </div>

    <div class="table-card">
      <div class="table-scroll">
        <table class="tx-table">
          <thead>
            <tr>
              <th class="col-tx">Transaction</th>
              <th class="col-category">Category</th>
              <th class="col-date">Date</th>
              <th class="col-method">Payment Method</th>
              <th class="col-amount align-right">Amount</th>
              <th class="col-status align-center">Status</th>
            </tr>
          </thead>
          <tbody id="transactionsTableBody"></tbody>
        </table>
      </div>
      <p id="emptyState" class="empty-state" hidden>No transactions match your filters.</p>
    </div>

    <div id="loadMoreWrap" class="load-more-wrap">
      <button type="button" id="loadMoreBtn" class="btn-secondary">Load more</button>
    </div>

  </main>
</div>

<script src="script.js" defer></script>
</body>
</html>
